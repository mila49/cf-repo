wb_sweep: true
sweep_method: grid

data_path: "Dataset/raw/matrix.mtx"

parameters:

  # Preprocessing
  n_top_genes:
    - 5000
    - 7000

  # Autoencoder
  batch_size:
    - 32
    - 64
    - 128

  latent_dim:
    - 8
    - 16
    - 32
    - 64
    - 100

  learning_rate:
    - 0.0001
    - 0.001

  # VAE-specific
  kl_weight:
    - 0.0001
    - 0.001
    - 0.01

training:
  max_epochs: 100

  early_stopping:
    enabled: true
    monitor: "val_mse"
    mode: "min"
    patience: 10
    min_delta: 0.0001

clustering_search:
  methods:
    - leiden
    - louvain
    - kmeans
    - gaussian_mixture

  leiden:
    n_neighbors:
      - 15
      - 30
      - 50
    resolution:
      - 0.2
      - 0.5
      - 0.8
      - 1.0

  louvain:
    n_neighbors:
      - 15
      - 30
      - 50
    resolution:
      - 0.2
      - 0.5
      - 0.8
      - 1.0

  kmeans:
    n_clusters:
      - 3
      - 5
      - 8
      - 10
      - 15

  gaussian_mixture:
    n_components:
      - 3
      - 5
      - 8
      - 10
      - 15
    covariance_type:
      - full
      - diag

evaluation:
  reconstruction_metrics:
    - train_mse
    - val_mse

  clustering_metrics:
    - silhouette_score
    - calinski_harabasz_score
    - davies_bouldin_score
    - n_clusters

output_obsm_key: "X_vae"
output_adata_path: "adata_vae.h5ad"
output_clustered_adata_path: "adata_vae_clustered.h5ad"
output_model_path: "vae_model.pt"

device: "cuda"
